<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>運動記録</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<header>

<h1>🏃 運動記録</h1>

<p>今日の頑張りを記録しましょう</p>

</header>



<section class="card">


<label>
📅 日付
</label>

<input 
type="date"
id="date"
>



<label>
🕒 時間
</label>

<input 
type="time"
id="time"
>



<label>
⏱ 運動時間（分）
</label>

<input 
type="number"
id="duration"
placeholder="例：30"
>



<label>
⚖️ 体重（kg）
</label>

<input 
type="number"
step="0.1"
id="weight"
placeholder="例：58.3"
>



<label>
🏃 運動種類
</label>


<select id="type">


<option>
ランニング
</option>


<option>
ウォーキング
</option>


<option>
筋トレ
</option>


<option>
ヨガ
</option>


<option>
サイクリング
</option>


<option>
その他
</option>


</select>



<label>
📝 メモ
</label>


<textarea 
id="memo"
placeholder="今日は何をしましたか？">
</textarea>



<button 
class="add-button"
onclick="saveExercise()"
>

保存

</button>



</section>


</div>



<script>


function saveExercise(){


const data = {


date:
document.getElementById("date").value,


time:
document.getElementById("time").value,


duration:
document.getElementById("duration").value,


weight:
document.getElementById("weight").value,


type:
document.getElementById("type").value,


memo:
document.getElementById("memo").value


};



let records =
JSON.parse(
localStorage.getItem("records")
) || [];


records.push(data);


localStorage.setItem(
"records",
JSON.stringify(records)
);



alert("保存しました！");


location.href="index.html";


}


</script>



</body>

</html>
