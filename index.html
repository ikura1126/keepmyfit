<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KeepMyFit</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b5cf6">
</head>

<body>

<div class="app">

    <header>
        <h1>KeepMyFit</h1>
        <p id="today"></p>
    </header>


    <section class="card">

        <h2>🔥 連続記録</h2>

        <div class="number">
            0日
        </div>

    </section>


    <section class="card">

        <h2>⚖️ 今日の体重</h2>

        <div class="number">
            -- kg
        </div>

    </section>


    <section class="card">

        <h2>🏃 今日の運動</h2>

        <div class="exercise" id="todayExercise">

    まだ記録がありません

</div>

    </section>


    <button 
class="add-button"
onclick="location.href='add.html'"
>
＋ 運動を記録する
</button>


</div>


<nav>

    <div>
        🏠
        <span>ホーム</span>
    </div>

    <div>
        📅
        <span>カレンダー</span>
    </div>

    <div>
        📊
        <span>統計</span>
    </div>
<div onclick="location.href='history.html'">

📚

<span>
履歴
</span>

</div>
</nav>


<script>


const today = new Date();


const year =
today.getFullYear();


const month =
today.getMonth()+1;


const day =
today.getDate();



const todayText =
`${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;



document.getElementById("today").innerHTML =

`${year}年${month}月${day}日`;




const records =

JSON.parse(
localStorage.getItem("records")
) || [];



const todayRecords =

records.filter(record =>

record.date === todayText

);



const area =

document.getElementById(
"todayExercise"
);



if(todayRecords.length > 0){



let html = "";

let total = 0;



todayRecords.forEach(record=>{


total += Number(record.duration);



html +=

`

<p>

🏃 ${record.type}

<br>

⏱ ${record.duration} 分

</p>

`;



});



html +=

`

<hr>

今日合計：
${total} 分

`;



area.innerHTML = html;



}else{


area.innerHTML =

"まだ記録がありません";


}



</script>
<script>

if ("serviceWorker" in navigator) {

    navigator.serviceWorker.register(
        "service-worker.js"
    );

}

</script>

</body>
</html>
